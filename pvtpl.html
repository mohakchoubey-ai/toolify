<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Music</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: yellow;
            margin-bottom: 40px;
        }

        button {
            padding: 25px 30px;
            font-size: 25px;
            border: none;
            border-radius: 10000px;
            background: #00ffcc;
            color: black;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00ccaa;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Private Playlist 🎧</h1>
    <button onclick="openPlaylist()"> Songs</button>
</div>

<script>
    function openPlaylist() {
        window.open(
            "https://www.youtube.com/watch?v=-SSp7w7Y9rU&list=PLrbOMqtQCEhndjqWc9ieWMKQl7XeIMQG8&pp=sAgC",
            "_blank"
        );
    }
</script>

</body>
</html>
