<h2 class="sr-only">An interactive animated pixel-art scene inspired by Floor796, featuring scrollable floors with characters from games, memes, and internet culture.</h2>
<style>
#scene-wrap{position:relative;overflow:hidden;border-radius:12px;background:#1a1025;border:0.5px solid var(--border);user-select:none;cursor:grab}
#scene-wrap:active{cursor:grabbing}
#cv{display:block}
#tooltip{position:absolute;pointer-events:none;background:rgba(10,5,20,0.92);border:1px solid rgba(180,140,255,0.4);border-radius:8px;padding:7px 12px;font-size:12px;color:#e8d8ff;max-width:200px;display:none;z-index:10;line-height:1.5}

.uibtn:hover{background:rgba(80,40,120,0.6)}
#info{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(10,5,20,0.75);border:1px solid rgba(180,140,255,0.25);border-radius:6px;padding:4px 14px;font-size:11px;color:rgba(200,170,255,0.7);pointer-events:none}

    <button class="uibtn" id="btn-zoom-out">−</button>

  </div>

  <div id="info">Floor 796 — An animated world full of references</div>
</div>
<script>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const tip = document.getElementById('tooltip');

let W, H;
function resize() {
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  cv.width = W;
  cv.height = H;
}
resize();
window.addEventListener('resize', () => { resize(); });

let dragging = false, lastMX = 0, lastMY = 0;
let tick = 0;

const WORLD_W = 2400, WORLD_H = 900;

  metal: '#556', metalH: '#889',
  skin: '#f4c78a', skinD: '#d4a060',
  dark: '#111', white: '#fff',
};

  {x:340, y:340, label:'☕', info:'Coffee machine\nFuel for productivity', anim:'steam', color:'#aa6633'},

const signs = [

// Background stars
const stars = Array.from({length:200}, () => ({
  x: Math.random() * WORLD_W,
  y: Math.random() * 140,
  r: Math.random() * 1.5 + 0.3,
  twinkle: Math.random() * Math.PI * 2,
}));

// Background city lights
const cityLights = Array.from({length:60}, () => ({
  x: Math.random() * WORLD_W,
  y: Math.random() * 120 + 30,
  w: Math.floor(Math.random() * 40 + 20),
  h: Math.floor(Math.random() * 80 + 40),
  lit: Array.from({length:6}, () => ({on: Math.random() > 0.3, timer: Math.random() * 100})),
}));

function drawBackground() {
  // Sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, 160);
  g.addColorStop(0, '#050210');
  g.addColorStop(1, '#180e28');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, WORLD_W, 200);

  // Stars
  for (const s of stars) {
    const a = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle + tick * 0.02));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();
  }

  // City silhouette
  ctx.fillStyle = '#0d0820';
  for (const b of cityLights) {
    ctx.fillRect(b.x, 160 - b.h, b.w, b.h);
  }
  // Window lights
  for (const b of cityLights) {
    const cols = Math.floor(b.w / 7);
    const rows = Math.floor(b.h / 9);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = (r * cols + c) % 6;
        const lit = b.lit[idx];
        if (lit.on) {
          ctx.fillStyle = Math.random() > 0.995 ? (lit.on = !lit.on, '#000') : 'rgba(255,230,100,0.7)';
          ctx.fillRect(b.x + c * 7 + 1, 160 - b.h + r * 9 + 2, 5, 6);
        }
      }
    }
  }
}

function drawFloors() {
  // Floor 2 (upper)
  ctx.fillStyle = C.wall1;
  ctx.fillRect(0, 200, WORLD_W, 200);
  ctx.fillStyle = '#2a1845';
  ctx.fillRect(0, 390, WORLD_W, 12);
  // Floor pattern
  for (let x = 0; x < WORLD_W; x += 60) {
    ctx.strokeStyle = 'rgba(100,60,180,0.15)';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(x, 200); ctx.lineTo(x, 400); ctx.stroke();
  }
  for (let y = 200; y < 402; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke();
  }
  // Ceiling lights upper
  for (let x = 100; x < WORLD_W; x += 200) {
    const glow = ctx.createRadialGradient(x, 205, 0, x, 205, 60);
    glow.addColorStop(0, 'rgba(120,80,255,0.2)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(x - 60, 200, 120, 80);
    ctx.fillStyle = '#aaaaff';
    ctx.fillRect(x - 15, 200, 30, 5);
    ctx.fillStyle = 'rgba(200,180,255,0.6)';
    ctx.fillRect(x - 15, 203, 30, 2);
  }

  // Floor 1 (lower)
  ctx.fillStyle = C.wall2;
  ctx.fillRect(0, 500, WORLD_W, 230);
  ctx.fillStyle = '#3a2560';
  ctx.fillRect(0, 695, WORLD_W, 15);
  // Floor pattern
  for (let x = 0; x < WORLD_W; x += 60) {
    ctx.strokeStyle = 'rgba(140,80,220,0.12)';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(x, 500); ctx.lineTo(x, 710); ctx.stroke();
  }
  for (let y = 500; y < 712; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke();
  }
  // Ceiling lights lower
  for (let x = 100; x < WORLD_W; x += 200) {
    const glow = ctx.createRadialGradient(x, 505, 0, x, 505, 70);
    glow.addColorStop(0, 'rgba(150,80,255,0.18)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(x - 70, 500, 140, 90);
    ctx.fillStyle = '#bbaaff';
    ctx.fillRect(x - 18, 500, 36, 5);
    ctx.fillStyle = 'rgba(210,190,255,0.6)';
    ctx.fillRect(x - 18, 503, 36, 2);
  }

  // Ground lines
  ctx.fillStyle = '#0a0518';
  ctx.fillRect(0, 708, WORLD_W, 200);
  // Reflection glow on ground
  const rg = ctx.createLinearGradient(0, 708, 0, 760);
  rg.addColorStop(0, 'rgba(140,80,255,0.15)');
  rg.addColorStop(1, 'transparent');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 708, WORLD_W, 52);
}

function drawDeco(d) {
  const {x, y, type, text} = d;
  if (type === 'screen') {
    ctx.fillStyle = '#111122';
    ctx.fillRect(x - 25, y - 35, 50, 40);
    ctx.fillStyle = '#0a1a3a';
    ctx.fillRect(x - 22, y - 32, 44, 32);
    // Scan line
    const sl = Math.floor(tick * 0.5) % 32;
    ctx.fillStyle = 'rgba(0,200,255,0.15)';
    ctx.fillRect(x - 22, y - 32 + sl, 44, 2);
    // Text
    ctx.fillStyle = '#00ffcc';
    ctx.font = '5px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(text || '>', x, y - 14);
    // Stand
    ctx.fillStyle = '#334';
    ctx.fillRect(x - 4, y + 5, 8, 12);
    ctx.fillRect(x - 12, y + 17, 24, 4);
  } else if (type === 'plant') {
    ctx.fillStyle = '#1a3a1a';
    ctx.fillRect(x - 8, y + 10, 16, 20);
    ctx.fillStyle = '#2a5a2a';
    ctx.beginPath(); ctx.arc(x, y + 5, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a7a3a';
    ctx.beginPath(); ctx.arc(x - 8, y - 2, 9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 8, y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y - 8, 10, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'arcade') {
    ctx.fillStyle = '#330033';
    ctx.fillRect(x - 18, y - 50, 36, 70);
    // Screen
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 12, y - 44, 24, 20);
    const ac = Math.floor(tick * 0.08) % 3;
    const acs = ['#ff2288','#00ffaa','#ffaa00'];
    ctx.fillStyle = acs[ac];
    ctx.font = '4px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(text || 'PLAY', x, y - 30);
    // Buttons
    ctx.fillStyle = '#ff0066'; ctx.beginPath(); ctx.arc(x - 6, y - 8, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0066ff'; ctx.beginPath(); ctx.arc(x + 6, y - 8, 4, 0, Math.PI * 2); ctx.fill();
    // Joystick
    ctx.fillStyle = '#666'; ctx.fillRect(x - 3, y + 2, 6, 10);
    ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(x, y + 2, 5, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'server') {
    ctx.fillStyle = '#223344';
    ctx.fillRect(x - 14, y - 50, 28, 65);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#2a4455' : '#1a3344';
      ctx.fillRect(x - 12, y - 46 + i * 12, 24, 10);
      // Activity lights
      const on = Math.floor(tick * 0.1 + i * 17) % 20 < 3;
      ctx.fillStyle = on ? '#00ff66' : '#004422';
      ctx.fillRect(x + 6, y - 44 + i * 12, 4, 4);
      ctx.fillStyle = (tick + i * 7) % 30 < 2 ? '#ffaa00' : '#332200';
      ctx.fillRect(x + 6, y - 38 + i * 12, 4, 4);
    }
  } else if (type === 'vending') {
    ctx.fillStyle = '#003355';
    ctx.fillRect(x - 16, y - 55, 32, 72);
    ctx.fillStyle = '#001122';
    ctx.fillRect(x - 11, y - 48, 22, 35);
    // Items in grid
    const items = ['🥤','☕','🍫','🍬','🍕','🌮'];
    ctx.font = '8px serif';
    ctx.textAlign = 'center';
    for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {
      ctx.fillText(items[r * 3 + c], x - 7 + c * 11, y - 35 + r * 14);
    }
    ctx.fillStyle = '#004488';
    ctx.fillRect(x - 11, y - 8, 22, 14);
    ctx.fillStyle = '#0066cc';
    ctx.fillRect(x - 9, y - 6, 18, 4);
  }
}

function drawSign(s) {
  const {x, y, text, color} = s;
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'left';
  const w = ctx.measureText(text).width + 20;
  const flicker = Math.sin(tick * 0.05 + x * 0.01) > 0.97 ? 0.3 : 1;
  // Glow
  ctx.shadowColor = color;
  ctx.shadowBlur = 12 * flicker;
  ctx.fillStyle = `rgba(0,0,0,0.7)`;
  ctx.fillRect(x, y - 18, w, 24);
  ctx.strokeStyle = color;
  ctx.globalAlpha = flicker;
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y - 18, w, 24);
  ctx.fillStyle = color;
  ctx.fillText(text, x + 10, y);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawChar(c) {
  const {x, anim, color} = c;
  const t = tick * 0.04;
  let dy = 0, dx = 0, rot = 0;

  if (anim === 'bob')    dy = Math.sin(t + x * 0.01) * 4;
  if (anim === 'bounce') dy = -Math.abs(Math.sin(t * 1.4 + x * 0.01)) * 8;
  if (anim === 'float')  dy = Math.sin(t * 0.7 + x * 0.01) * 6;
  if (anim === 'fly')    { dy = Math.sin(t + x * 0.005) * 10; dx = Math.cos(t * 0.5) * 3; }
  if (anim === 'dance')  { dy = Math.sin(t * 2) * 5; dx = Math.cos(t * 2) * 3; }
  if (anim === 'sway')   dx = Math.sin(t * 0.8) * 5;
  if (anim === 'trot')   { dy = Math.abs(Math.sin(t * 1.5)) * -4; dx = Math.sin(t * 0.3) * 2; }
  if (anim === 'spin')   rot = t;
  if (anim === 'wave')   { dy = Math.sin(t) * 6; }
  if (anim === 'run')    { dy = Math.abs(Math.sin(t * 2)) * -3; dx = Math.cos(t * 3) * 2; }
  if (anim === 'walk')   { dy = Math.abs(Math.sin(t * 1.5)) * -3; dx = tick % 120 < 60 ? 0.5 : -0.5; }
  if (anim === 'type')   dy = Math.floor(t * 2) % 2 === 0 ? 0 : -2;
  if (anim === 'cast')   { dy = Math.sin(t) * 5; }
  if (anim === 'steam')  dy = -Math.abs(Math.sin(t)) * 3;
  if (anim === 'waddle') { dy = Math.abs(Math.sin(t * 2)) * -2; dx = Math.sin(t * 2) * 2; }
  if (anim === 'breathe') dy = Math.sin(t * 0.5) * 3;
  if (anim === 'idle')   dy = Math.sin(t * 0.3) * 2;

  const cx = x + dx, cy = c.y + dy;

  // Glow shadow
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;

  ctx.save();
  ctx.translate(cx, cy);
  if (rot) ctx.rotate(rot);
  ctx.font = '26px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(c.label, 0, 0);
  ctx.restore();
  ctx.shadowBlur = 0;

  // Click glow ring if hovered
  if (c._hov) {
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
  }
}

// Scan-line overlay
function drawScanlines() {
  ctx.save();
  ctx.globalAlpha = 0.03;
  for (let y = 0; y < WORLD_H; y += 4) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, y, WORLD_W, 2);
  }
  ctx.restore();
}

function worldToScreen(wx, wy) {
  return [(wx - camX) * zoom, (wy - camY) * zoom];
}
function screenToWorld(sx, sy) {
  return [sx / zoom + camX, sy / zoom + camY];
}

// Hit detection
function hitChar(wx, wy) {
  for (const c of chars) {
    const t = tick * 0.04;
    let dy = 0, dx = 0;
    if (c.anim === 'bob')    dy = Math.sin(t + c.x * 0.01) * 4;
    if (c.anim === 'bounce') dy = -Math.abs(Math.sin(t * 1.4 + c.x * 0.01)) * 8;
    if (c.anim === 'float')  dy = Math.sin(t * 0.7 + c.x * 0.01) * 6;
    const cx = c.x + dx, cy = c.y + dy;
    if (Math.hypot(wx - cx, wy - cy) < 18) return c;
  }
  return null;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-camX, -camY);

  drawBackground();
  drawFloors();

  // Particle trail (nyan-cat-like, upper bg area only)
  for (let i = 0; i < 12; i++) {
    const t = tick - i * 3;
    const px = ((t * 2) % WORLD_W + WORLD_W) % WORLD_W;
    const py = 135 + Math.sin(t * 0.12) * 30;
    const cols = ['#ff0088','#ff8800','#ffff00','#00ff00','#0088ff','#8800ff'];
    ctx.fillStyle = cols[Math.floor(i * 6 / 12)];
    ctx.globalAlpha = (12 - i) / 14;
    ctx.fillRect(px - 6, py - 2, 14, 5);
    ctx.globalAlpha = 1;
  }

  // Decorations
  for (const d of decos) drawDeco(d);
  // Neon signs
  for (const s of signs) drawSign(s);
  // Characters
  for (const c of chars) drawChar(c);
  // Scanlines
  drawScanlines();
  // Vignette
  const vig = ctx.createRadialGradient(camX + W / (2 * zoom), camY + H / (2 * zoom), H * 0.2 / zoom, camX + W / (2 * zoom), camY + H / (2 * zoom), H * 0.8 / zoom);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vig;
  ctx.fillRect(camX, camY, W / zoom, H / zoom);

  ctx.restore();

  tick++;
  requestAnimationFrame(draw);
}

// Center view initially
camX = (WORLD_W - W / zoom) / 2;
camY = (WORLD_H / 2 - H / (2 * zoom)) * 0.6;
zoom = 0.55;

// Input handling
wrap.addEventListener('mousedown', e => {
  dragging = true;
  lastMX = e.clientX;
  lastMY = e.clientY;
});
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (dragging) {
    camX -= (e.clientX - lastMX) / zoom;
    camY -= (e.clientY - lastMY) / zoom;
    lastMX = e.clientX;
    lastMY = e.clientY;
    clampCam();
  } else {
    const rect = wrap.getBoundingClientRect();
    const [wx, wy] = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    let found = null;
    for (const c of chars) { c._hov = false; }
    const hov = hitChar(wx, wy);
    if (hov) {
      hov._hov = true;
      wrap.style.cursor = 'pointer';
      tip.style.display = 'block';
      tip.style.left = (e.clientX - rect.left + 14) + 'px';
      tip.style.top = (e.clientY - rect.top - 10) + 'px';
      tip.textContent = hov.info;
    } else {
      wrap.style.cursor = dragging ? 'grabbing' : 'grab';
      tip.style.display = 'none';
    }
  }
});
wrap.addEventListener('click', e => {
  if (Math.abs(e.clientX - lastMX) < 4 && Math.abs(e.clientY - lastMY) < 4) {
    const rect = wrap.getBoundingClientRect();
    const [wx, wy] = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    const hit = hitChar(wx, wy);
    if (hit) {
      tip.style.display = 'block';
      tip.textContent = hit.info;
    }
  }
});
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const [wx, wy] = screenToWorld(mx, my);
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  zoom = Math.max(0.3, Math.min(2.5, zoom * factor));
  camX = wx - mx / zoom;
  camY = wy - my / zoom;
  clampCam();
}, {passive: false});

// Touch
let lastPinch = 0;
wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true;
    lastMX = e.touches[0].clientX;
    lastMY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    lastPinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}, {passive: true});
wrap.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging) {
    camX -= (e.touches[0].clientX - lastMX) / zoom;
    camY -= (e.touches[0].clientY - lastMY) / zoom;
    lastMX = e.touches[0].clientX;
    lastMY = e.touches[0].clientY;
    clampCam();
  } else if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    zoom = Math.max(0.3, Math.min(2.5, zoom * (d / lastPinch)));
    lastPinch = d;
    clampCam();
  }
  e.preventDefault();
}, {passive: false});
wrap.addEventListener('touchend', () => dragging = false, {passive: true});

function clampCam() {
  const maxX = WORLD_W - W / zoom;
  const maxY = WORLD_H - H / zoom;
  camX = Math.max(0, Math.min(maxX, camX));
  camY = Math.max(0, Math.min(maxY, camY));
}

document.getElementById('btn-zoom-in').onclick = () => { zoom = Math.min(2.5, zoom * 1.2); clampCam(); };
document.getElementById('btn-zoom-out').onclick = () => { zoom = Math.max(0.3, zoom / 1.2); clampCam(); };
document.getElementById('btn-reset').onclick = () => { zoom = 0.55; camX = (WORLD_W - W / zoom) / 2; camY = (WORLD_H / 2 - H / (2 * zoom)) * 0.6; };

draw();
</script>
