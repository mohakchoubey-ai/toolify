<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MohakGPT</title>
  <link rel="stylesheet" href="assets/chatbot.css">
</head>
<body class="theme-light">

  <script> 
   const API_KEY = "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";

  </script>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="createNewChat()">＋ New Chat</button>
      <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
      <div class="theme-row">
        <span class="theme-label">Theme</span>
        <div class="theme-options">
          <button class="theme-btn" data-theme="light" onclick="setTheme('light')">☀️ Light</button>
          <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">🌙 Dark</button>
        </div>
      </div>
      <div class="sidebar-links">
        <a href="privacy.html" target="_blank">Privacy Policy</a>
        <a href="terms.html" target="_blank">Terms</a>
      </div>
    </div>
  </div>

  <!-- Mobile overlay -->
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- Main -->
  <div class="main">
    <div class="header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="logo">⚡</div>
      <div>
        <div class="header-title">MohakGPT</div>
        <div class="header-sub">by <a href="https://mohakdev1220.github.io/toolify/" target="_blank">Toolify</a> • AI Assistant</div>
      </div>
      <a class="toolify-btn" href="https://mohakdev1220.github.io/toolify/" target="_blank">🔗 Toolify</a>
    </div>

    <div id="messages"></div>

    <div id="suggestions">
      <button class="suggestion" onclick="sendMsg('Current affairs of India')"> Current affairs </button>
      <button class="suggestion" onclick="sendMsg('Toolify mein kya tools hain?')"> useful Tools  </button>
      <button class="suggestion" onclick="sendMsg('Who made Toolify?')">Who made Toolify?</button>
      <button class="suggestion" onclick="sendMsg('What is artificial intelligence?')"> What is AI ?</button>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="inputBox" rows="1"
          placeholder="Kuch bhi pooch... ⚡"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
          oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
        <button id="sendBtn" onclick="sendMsg()">➤</button>
      </div>
      <div class="hint">
        ⚠️ MohakGPT can make mistakes, double check it &nbsp;|&nbsp;
        <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a>
      </div>
    </div>
  </div>

  <script src="assets/chatbot.js"></script>
</body>
</html>
