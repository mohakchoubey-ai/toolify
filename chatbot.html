<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MohakGPT</title>
  <link rel="stylesheet" href="assets/chatbot.css">
</head>
<body>

  <script>
    const API_KEY = "AIzaSyDGLs_Hb1T2fmKK-inyHve-YifbnGGLtlA";
  </script>

  <div class="header">
    <div class="logo">🧠</div>
    <div>
      <div class="header-title">MohakGPT</div>
      <div class="header-sub">by <a href="https://mohakdev1220.github.io/toolify/" target="_blank">Toolify</a> • Maths, Science & More</div>
    </div>
    <a class="toolify-btn" href="https://mohakdev1220.github.io/toolify/" target="_blank">🔗 Toolify</a>
  </div>

  <div id="messages">
    <div class="msg">
      <div class="avatar">🧠</div>
      <div class="bubble bot">Hey! 👋 Main hoon <strong>MohakGPT</strong> — Mohak ka apna AI!<br>Maths, Science, ya Toolify ke baare mein kuch bhi pooch. Short mein poochoge toh better! 🎯</div>
    </div>
  </div>

  <div id="suggestions">
    <button class="suggestion" onclick="sendMsg('What is photosynthesis?')">What is photosynthesis?</button>
    <button class="suggestion" onclick="sendMsg('Toolify mein kya tools hain?')">Toolify tools kya hain?</button>
    <button class="suggestion" onclick="sendMsg('Who made Toolify?')">Who made Toolify?</button>
    <button class="suggestion" onclick="sendMsg('What is 12 x 12?')">12 x 12 = ?</button>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="inputBox" rows="1" placeholder="Kuch pooch — maths, science, Toolify... 🎯"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button id="sendBtn" onclick="sendMsg()">➤</button>
    </div>
    <div class="hint">Short questions = better answers • Enter to send</div>
  </div>

  <script src="assets/chatbot.js"></script>
</body>
</html>
