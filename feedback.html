<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Feedback - Toolify</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 400px; 
        }
        .brand-name {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        h2 { 
            margin-top: 0; 
            color: #2d3436; 
            font-size: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        label { 
            display: block; 
            margin: 15px 0 5px; 
            color: #636e72; 
            font-size: 14px; 
            font-weight: 600;
        }
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #dfe6e9; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: inherit;
            background-color: #fcfcfc;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
            background-color: #fff;
        }
        button { 
            margin-top: 25px; 
            width: 100%; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: background-color 0.2s, transform 0.2s;
        }
        button:hover { 
            background-color: #0056b3; 
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="brand-name">toolify</div>
    <h2>Send us your thoughts</h2>
    
    <form action="https://formspree.io/f/xkowpdnv" method="POST">
        <label for="email">Your Email</label>
        <input type="email" name="email" id="email" placeholder="email@example.com" required>

        <label for="message">Your Message</label>
        <textarea name="message" id="message" rows="5" placeholder="How can we improve?" required></textarea>

        <input type="hidden" name="_next" value="https://mohakdev1220.github.io/toolify/thanks.html">
        
        <input type="text" name="_gotcha" style="display:none">

        <button type="submit">Send Feedback</button> 
    </form>
</div>

</body>
</html>
