<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch The Blocks</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

#game{
    position:relative;
    width:min(95vw,500px);
    height:min(90vh,700px);
    background:#1e293b;
    border:3px solid #fff;
    overflow:hidden;
    border-radius:15px;
    touch-action:none;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:22px;
    font-weight:bold;
    z-index:100;
}

#player{
    position:absolute;
    width:90px;
    height:18px;
    background:#22c55e;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    border-radius:20px;
    box-shadow:0 0 15px #22c55e;
}

.block{
    position:absolute;
    width:30px;
    height:30px;
    background:#ef4444;
    border-radius:8px;
    box-shadow:0 0 10px #ef4444;
}

#gameover{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.9);
    color:white;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
    z-index:1000;
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="game">

    <div id="score">Score: 0</div>

    <div id="player"></div>

    <div id="gameover">
        <h1>Game Over</h1>
        <button onclick="location.reload()">Play Again</button>
    </div>

</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreDisplay = document.getElementById("score");
const gameover = document.getElementById("gameover");

let score = 0;
let running = true;

let playerX = game.clientWidth / 2 - 45;

function updatePlayer(){
    player.style.left = playerX + "px";
}

updatePlayer();

function movePlayer(clientX){
    const rect = game.getBoundingClientRect();

    playerX = clientX - rect.left - 45;

    if(playerX < 0) playerX = 0;
    if(playerX > game.clientWidth - 90)
        playerX = game.clientWidth - 90;

    updatePlayer();
}

game.addEventListener("mousemove",e=>{
    movePlayer(e.clientX);
});

game.addEventListener("touchmove",e=>{
    movePlayer(e.touches[0].clientX);
});

function createBlock(){

    if(!running) return;

    const block = document.createElement("div");
    block.className = "block";

    let x = Math.random() * (game.clientWidth - 30);
    let y = -30;
    let speed = 3 + score * 0.05;

    block.style.left = x + "px";
    block.style.top = y + "px";

    game.appendChild(block);

    function fall(){

        if(!running) return;

        y += speed;
        block.style.top = y + "px";

        const b = block.getBoundingClientRect();
        const p = player.getBoundingClientRect();

        const caught =
            b.bottom >= p.top &&
            b.left < p.right &&
            b.right > p.left;

        if(caught){
            score++;
            scoreDisplay.textContent = "Score: " + score;

            block.remove();
            return;
        }

        if(y > game.clientHeight){
            running = false;
            gameover.style.display = "flex";
            return;
        }

        requestAnimationFrame(fall);
    }

    requestAnimationFrame(fall);
}

setInterval(()=>{
    if(running) createBlock();
},700);
</script>

</body>
</html>
