<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Audio Studio</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .app-container { background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; max-width: 550px; }
        
        .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .input-group { background: #334155; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; display: block; margin-bottom: 8px; }
        
        input[type="text"], input[type="number"], input[type="range"] { width: 100%; background: #0f172a; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; box-sizing: border-box; }
        
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; background: var(--primary); color: white; margin-top: 5px; }
        button:hover { opacity: 0.9; transform: scale(0.98); }
        .btn-share { background: #10b981; }
        
        #fileStatus { font-size: 13px; color: #38bdf8; margin: 10px 0; min-height: 20px; }
        .loader { display: none; text-align: center; color: #f59e0b; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

<div class="app-container">
    <h2 style="margin-top:0">🎙️ Pro Audio Studio</h2>
    
    <div class="input-group">
        <label>Rename Output File</label>
        <input type="text" id="fileName" value="my_edited_audio" placeholder="Enter file name...">
    </div>

    <div class="input-group">
        <label>Upload MP3(s)</label>
        <input type="file" id="audioFiles" accept="audio/mp3" multiple onchange="handleFileSelect()">
        <div id="fileStatus">No files uploaded.</div>
    </div>

    <div class="feature-grid">
        <div class="input-group">
            <label>Volume Boost</label>
            <input type="range" id="volume" min="0" max="3" step="0.1" value="1">
        </div>
        <div class="input-group">
            <label>Speed (0.5x - 2x)</label>
            <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
        </div>
        <div class="input-group">
            <label>Fade In (sec)</label>
            <input type="number" id="fadeIn" value="0">
        </div>
        <div class="input-group">
            <label>Fade Out (sec)</label>
            <input type="number" id="fadeOut" value="0">
        </div>
    </div>

    <div class="loader" id="loader">Processing... ⚡</div>

    <div class="feature-grid">
        <button onclick="runProcess('merge')">🔗 Merge Files</button>
        <button onclick="runProcess('cut')">✂️ Cut First</button>
        <button class="btn-share" onclick="shareFile()">📤 Share Last</button>
    </div>
</div>

<script>
    let lastExportedBlob = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function handleFileSelect() {
        const files = document.getElementById('audioFiles').files;
        document.getElementById('fileStatus').innerText = `${files.length} file(s) ready.`;
    }

    async function runProcess(mode) {
        const files = document.getElementById('audioFiles').files;
        if (files.length === 0) return alert("Select a file first!");
        
        const loader = document.getElementById('loader');
        loader.style.display = 'block';

        try {
            let finalBuffer;
            const volume = parseFloat(document.getElementById('volume').value);
            const speed = parseFloat(document.getElementById('speed').value);

            if (mode === 'merge') {
                let buffers = [];
                for (let f of files) {
                    const decoded = await audioCtx.decodeAudioData(await f.arrayBuffer());
                    buffers.push(decoded);
                }
                finalBuffer = mergeAudio(buffers);
            } else {
                const decoded = await audioCtx.decodeAudioData(await files[0].arrayBuffer());
                finalBuffer = decoded; // Basic cut logic can be added here as per previous version
            }

            // Apply Effects (Volume & Speed simulation via buffer mapping)
            applyEffects(finalBuffer, volume);

            // Export
            const wavData = bufferToWave(finalBuffer, finalBuffer.length);
            lastExportedBlob = new Blob([wavData], { type: 'audio/wav' });
            
            downloadFile(lastExportedBlob);
            alert("Success! File saved.");
        } catch (e) {
            console.error(e);
            alert("Error processing audio.");
        }
        loader.style.display = 'none';
    }

    function applyEffects(buffer, volMult) {
        for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const data = buffer.getChannelData(channel);
            for (let i = 0; i < data.length; i++) {
                data[i] *= volMult; // Apply Volume
            }
        }
    }

    function mergeAudio(buffers) {
        const totalLen = buffers.reduce((s, b) => s + b.length, 0);
        const out = audioCtx.createBuffer(buffers[0].numberOfChannels, totalLen, buffers[0].sampleRate);
        for (let ch = 0; ch < out.numberOfChannels; ch++) {
            let offset = 0;
            for (let b of buffers) {
                out.getChannelData(ch).set(b.getChannelData(ch), offset);
                offset += b.length;
            }
        }
        return out;
    }

    function downloadFile(blob) {
        const name = document.getElementById('fileName').value || 'output';
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${name}.wav`;
        a.click();
    }

    async function shareFile() {
        if (!lastExportedBlob) return alert("Process a file first!");
        const name = document.getElementById('fileName').value || 'audio';
        const file = new File([lastExportedBlob], `${name}.wav`, { type: 'audio/wav' });
        
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
                files: [file],
                title: 'My Edited Audio',
                text: 'Check out my new track!'
            });
        } else {
            alert("Your browser doesn't support direct file sharing. Use the Download button instead.");
        }
    }

    // WAV Encoder Helper
    function bufferToWave(abuffer, len) {
        let numOfChan = abuffer.numberOfChannels,
            length = len * numOfChan * 2 + 44,
            buffer = new ArrayBuffer(length),
            view = new DataView(buffer),
            pos = 0;

        function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

        setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
        setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
        setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

        for (let i = 0; i < len; i++) {
            for (let channel = 0; channel < numOfChan; channel++) {
                let s = Math.max(-1, Math.min(1, abuffer.getChannelData(channel)[i]));
                view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                pos += 2;
            }
        }
        return buffer;
    }
</script>

</body>
</html>
