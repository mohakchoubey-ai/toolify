<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad Pro Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Replace with your Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.firebaseAuth = { auth, db, provider, signInWithPopup, signOut, onAuthStateChanged, doc, setDoc, getDoc };
  </script>

  <style>
    :root {
      --bg-color: #f1f5f9;
      --panel-bg: #ffffff;
      --text-color: #0f172a;
      --subtext-color: #64748b;
      --border-color: #cbd5e1;
      --button-bg: #f8fafc;
      --button-hover: #e2e8f0;
      --accent-color: #2563eb;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    body.dark-mode {
      --bg-color: #090d16;
      --panel-bg: #111827;
      --text-color: #f3f4f6;
      --subtext-color: #9ca3af;
      --border-color: #1f2937;
      --button-bg: #1f2937;
      --button-hover: #374151;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .group {
      display: flex;
      gap: 6px;
      align-items: center;
      border-right: 1px solid var(--border-color);
      padding-right: 10px;
    }
    .group:last-child { border-right: none; }

    button, select, input[type="color"], .btn-link {
      background: var(--button-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover, select:hover, .btn-link:hover { 
      background: var(--button-hover);
      border-color: var(--subtext-color);
    }

    .btn-dashboard {
      background-color: var(--accent-color);
      color: #ffffff !important;
      border: none;
    }
    .btn-dashboard:hover {
      background-color: #1d4ed8;
    }

    input[type="color"] {
      padding: 2px 4px;
      width: 36px;
      height: 32px;
      cursor: pointer;
    }

    /* Workspace & Fixed Editor Border Overlap */
    .workspace {
      flex: 1;
      display: flex;
      justify-content: center;
      overflow-y: auto;
      padding: 40px 20px;
    }

    #editor {
      width: 100%;
      max-width: 900px;
      min-height: 80vh;
      background: var(--panel-bg);
      padding: 60px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      outline: none;
      line-height: 1.8;
      font-size: 16px;
      word-break: break-word;
      overflow-wrap: break-word;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #editor:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Enhanced Focus Mode */
    body.focus-mode header, 
    body.focus-mode .status-bar {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: all 0.4s ease;
    }
    body.focus-mode .workspace {
      padding: 10px;
    }
    body.focus-mode #editor {
      max-width: 1000px;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    /* User Profile Section */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Status Bar */
    .status-bar {
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      padding: 10px 24px;
      font-size: 12px;
      color: var(--subtext-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.4s ease;
    }

    .badge {
      background: var(--button-bg);
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    @media print {
      header, .status-bar { display: none !important; }
      body { background: white; color: black; }
      #editor { box-shadow: none; border: none; padding: 0; width: 100%; max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="toolbar">
      <div class="group">
        <a href="https://mohakchoubey.github.io/toolify/dashboard" class="btn-link btn-dashboard">
          ⬅ Dashboard
        </a>
      </div>

      <div class="group">
        <button onclick="newDoc()" title="New Document">📄 New</button>
        <button onclick="document.getElementById('fileInput').click()" title="Open File">📂 Open</button>
        <input type="file" id="fileInput" hidden accept=".txt,.html,.md" onchange="loadFile(event)">
        <button onclick="handleSave('txt')">💾 .txt</button>
        <button onclick="handleSave('html')">🌐 .html</button>
        <button onclick="handleSave('pdf')">🖨️ PDF</button>
      </div>

      <div class="group">
        <select onchange="execCmd('fontName', this.value)">
          <option value="Inter">Sans-Serif</option>
          <option value="Georgia">Serif</option>
          <option value="JetBrains Mono">Monospace</option>
        </select>
        <select onchange="execCmd('formatBlock', this.value)">
          <option value="P">Paragraph</option>
          <option value="H1">Heading 1</option>
          <option value="H2">Heading 2</option>
          <option value="H3">Heading 3</option>
        </select>
      </div>

      <div class="group">
        <button onclick="execCmd('bold')"><b>B</b></button>
        <button onclick="execCmd('italic')"><i>I</i></button>
        <button onclick="execCmd('underline')"><u>U</u></button>
        <button onclick="execCmd('strikeThrough')"><s>S</s></button>
      </div>

      <div class="group">
        <input type="color" title="Text Color" onchange="execCmd('foreColor', this.value)">
        <input type="color" value="#ffffff" title="Highlight Color" onchange="execCmd('hiliteColor', this.value)">
      </div>
    </div>

    <div class="toolbar">
      <button onclick="toggleFocusMode()">🧘 Focus</button>
      <button onclick="toggleTheme()">🌙 Theme</button>
      <div id="authContainer">
        <button onclick="handleGoogleLogin()" class="btn-dashboard" style="background:#ea4335;">Sign in with Google</button>
      </div>
    </div>
  </header>

  <!-- Writing Area -->
  <div class="workspace">
    <div id="editor" contenteditable="true" spellcheck="true" placeholder="Start typing here..."></div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div>
      Words: <span id="wordCount" class="badge">0</span> &nbsp;|&nbsp; 
      Chars: <span id="charCount" class="badge">0</span> &nbsp;|&nbsp; 
      Read Time: <span id="readTime" class="badge">0 min</span>
    </div>
    <div id="autoSaveState">Synced</div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    let currentUser = null;
    let saveTimeout = null;

    // Rich Formatting Handler
    function execCmd(command, value = null) {
      document.execCommand(command, false, value);
      editor.focus();
      updateStats();
    }

    // Auth & Firestore State Management
    window.addEventListener('load', () => {
      // Wait for firebase script initialization
      setTimeout(() => {
        const { auth, provider, signInWithPopup, signOut, onAuthStateChanged, db, doc, getDoc } = window.firebaseAuth;

        onAuthStateChanged(auth, async (user) => {
          const authContainer = document.getElementById('authContainer');
          if (user) {
            currentUser = user;
            authContainer.innerHTML = `
              <div class="user-profile">
                <img src="${user.photoURL}" alt="Avatar" class="user-avatar" title="${user.email}">
                <span>${user.displayName || user.email.split('@')[0]}</span>
                <button onclick="handleLogout()" style="padding:4px 8px; font-size:11px;">Logout</button>
              </div>
            `;
            // Load from Firestore
            try {
              const docRef = doc(db, "notes", user.uid);
              const docSnap = await getDoc(docRef);
              if (docSnap.exists() && docSnap.data().content) {
                editor.innerHTML = docSnap.data().content;
              } else {
                loadLocalStorageFallback();
              }
            } catch (err) {
              console.error("Error loading from Firestore:", err);
              loadLocalStorageFallback();
            }
          } else {
            currentUser = null;
            authContainer.innerHTML = `<button onclick="handleGoogleLogin()" class="btn-dashboard" style="background:#ea4335;">Sign in with Google</button>`;
            loadLocalStorageFallback();
          }
          updateStats();
        });
      }, 500);
    });

    window.handleGoogleLogin = async () => {
      const { auth, provider, signInWithPopup } = window.firebaseAuth;
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Login Failed", error);
      }
    };

    window.handleLogout = async () => {
      const { auth, signOut } = window.firebaseAuth;
      await signOut(auth);
    };

    function loadLocalStorageFallback() {
      const saved = localStorage.getItem('notepad_pro_content');
      if (saved) {
        editor.innerHTML = saved;
      } else {
        editor.innerHTML = '<h2>Welcome! 🚀</h2><p>Start editing or type your notes here...</p>';
      }
    }

    // Real-time Stats & Sync to Firestore / LocalStorage
    function updateStats() {
      const text = editor.innerText.trim();
      const words = text ? text.split(/\s+/).filter(w => w.length > 0).length : 0;
            
      document.getElementById('wordCount').textContent = words;
      document.getElementById('charCount').textContent = text.length;
      document.getElementById('readTime').textContent = `${Math.ceil(words / 200)} min`;

      // Local storage backup
      localStorage.setItem('notepad_pro_content', editor.innerHTML);

      // Cloud Auto-Save with debounce
      document.getElementById('autoSaveState').textContent = 'Saving...';
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        if (currentUser && window.firebaseAuth) {
          try {
            const { db, doc, setDoc } = window.firebaseAuth;
            await setDoc(doc(db, "notes", currentUser.uid), {
              content: editor.innerHTML,
              updatedAt: new Date()
            });
            document.getElementById('autoSaveState').textContent = 'Cloud Synced ✓';
          } catch (e) {
            document.getElementById('autoSaveState').textContent = 'Sync Failed';
          }
        } else {
          document.getElementById('autoSaveState').textContent = 'Saved Locally';
        }
      }, 1000);
    }

    editor.addEventListener('input', updateStats);

    // Export Options
    function handleSave(type) {
      if (type === 'txt') {
        const blob = new Blob([editor.innerText], { type: "text/plain;charset=utf-8" });
        download(blob, "document.txt");
      } else if (type === 'html') {
        const blob = new Blob([editor.innerHTML], { type: "text/html;charset=utf-8" });
        download(blob, "document.html");
      } else if (type === 'pdf') {
        window.print();
      }
    }

    function download(blob, name) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
    }

    function newDoc() {
      if (confirm("Create a new document?")) {
        editor.innerHTML = "";
        updateStats();
      }
    }

    function loadFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        if (file.name.endsWith('.html')) {
          editor.innerHTML = e.target.result;
        } else {
          editor.innerText = e.target.result;
        }
        updateStats();
      };
      reader.readAsText(file);
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    function toggleFocusMode() {
      document.body.classList.toggle('focus-mode');
    }
  </script>
</body>
</html>
