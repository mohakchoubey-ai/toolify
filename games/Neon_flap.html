<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Neon Flap Bird </title>
<style>
  :root{
    --accent:#61f2ff;
    --accent2:#ff5ecf;
    --panel:rgba(8,14,28,.62);
    --panel2:rgba(12,22,44,.82);
    --text:#f5fbff;
    --muted:rgba(245,251,255,.72);
    --border:rgba(255,255,255,.12);
    --shadow:0 20px 60px rgba(0,0,0,.35);
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040c;
    font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    touch-action:none;
    overscroll-behavior:none;
  }

  body{
    position:fixed;
    inset:0;
    color:var(--text);
    visibility:hidden;
  }

  canvas{
    display:block;
    width:100vw;
    height:100vh;
  }

  #hud{
    position:fixed;
    top:14px;
    left:14px;
    right:14px;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    z-index:20;
    pointer-events:none;
  }

  .pill{
    pointer-events:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border:1px solid var(--border);
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    box-shadow:var(--shadow);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    font-weight:700;
    letter-spacing:.02em;
  }

  .pill b{
    color:white;
    font-size:1.02rem;
  }

  #statePill{
    margin-left:auto;
    color:var(--muted);
    font-weight:800;
  }

  #desktopHint{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:25;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.08);
    box-shadow:var(--shadow);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    color:var(--text);
    font-size:.95rem;
    user-select:none;
  }

  .keycap{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:38px;
    padding:7px 10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.12);
    font-weight:800;
    letter-spacing:.04em;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
  }

  #mobileControls{
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:25;
    display:none;
    gap:12px;
    user-select:none;
  }

  .ctrlBtn{
    min-width:118px;
    min-height:58px;
    padding:0 18px;
    border:none;
    border-radius:18px;
    color:#06101d;
    font-weight:900;
    font-size:1rem;
    letter-spacing:.08em;
    background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(204,245,255,.88));
    box-shadow:0 18px 35px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.8);
    touch-action:none;
  }

  .ctrlBtn.secondary{
    min-width:82px;
    font-size:.95rem;
    letter-spacing:.04em;
    background:linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.12));
    color:var(--text);
    border:1px solid rgba(255,255,255,.14);
  }

  #menu, #options{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:radial-gradient(circle at 50% 25%, rgba(255,255,255,.08), rgba(0,0,0,.72) 48%, rgba(0,0,0,.9) 100%);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }

  .panel{
    width:min(92vw, 520px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:28px;
    background:linear-gradient(180deg, rgba(8,16,34,.86), rgba(7,11,22,.92));
    box-shadow:0 30px 90px rgba(0,0,0,.45);
    padding:22px;
  }

  .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    margin-bottom:14px;
    border-radius:999px;
    background:rgba(255,255,255,.08);
    color:var(--muted);
    font-weight:700;
    font-size:.8rem;
    letter-spacing:.12em;
    text-transform:uppercase;
  }

  .panel h1{
    font-size:clamp(2rem, 6vw, 3.8rem);
    line-height:1;
    margin-bottom:10px;
  }

  .panel p{
    color:var(--muted);
    line-height:1.6;
    margin-bottom:14px;
  }

  .stats{
    white-space:pre-line;
    margin:8px 0 16px;
    padding:14px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);
    color:rgba(245,251,255,.9);
    font-weight:700;
  }

  .row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:12px;
  }

  button{
    cursor:pointer;
    border:none;
    font:inherit;
  }

  .primary{
    flex:1 1 180px;
    min-height:54px;
    border-radius:16px;
    font-weight:900;
    font-size:1rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#05111c;
    background:linear-gradient(180deg, #fdfefe, #bdefff);
    box-shadow:0 14px 40px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.75);
  }

  .ghost{
    flex:1 1 140px;
    min-height:54px;
    border-radius:16px;
    font-weight:800;
    color:var(--text);
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);
  }

  .tiny{
    margin-top:14px;
    font-size:.92rem;
    color:rgba(245,251,255,.65);
  }

  #options .panel{
    max-width:560px;
  }

  .field{
    display:grid;
    gap:8px;
    margin:14px 0;
  }

  .field label{
    font-weight:800;
    color:rgba(245,251,255,.86);
  }

  select, input[type="checkbox"]{
    accent-color:var(--accent);
  }

  select{
    width:100%;
    min-height:50px;
    padding:12px 14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);
    color:var(--text);
    outline:none;
  }

  .checkRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-height:48px;
    padding:10px 14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);
  }

  .checkRow span{
    color:rgba(245,251,255,.9);
    font-weight:800;
  }

  @media (pointer:coarse){
    #desktopHint{ display:none; }
    #mobileControls{ display:flex; }
  }

  @media (max-width:480px){
    #hud{
      top:10px;
      left:10px;
      right:10px;
      gap:8px;
      flex-wrap:wrap;
    }
    .pill{
      padding:8px 12px;
      font-size:.9rem;
    }
    .panel{
      padding:18px;
      border-radius:24px;
    }
    .primary,.ghost{
      flex:1 1 100%;
    }
    .ctrlBtn{
      min-width:104px;
      min-height:56px;
    }
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="pill">Score <b id="score">0</b></div>
    <div class="pill">Best <b id="best">0</b></div>
    <div class="pill" id="statePill">READY</div>
  </div>

  <div id="desktopHint">
    <span class="keycap">SPACE</span>
    <span class="keycap">↑</span>
    <span>or click to flap</span>
  </div>

  <div id="mobileControls">
    <button class="ctrlBtn" id="flapBtn">FLAP</button>
    <button class="ctrlBtn secondary" id="pauseBtn">PAUSE</button>
  </div>

  <div id="menu">
    <div class="panel">
      <div class="tag">NEON FLAP // ULTRA</div>
      <h1 id="menuTitle">NEON FLAP</h1>
      <p id="menuText">Fly through the neon pipes. Stay alive. Score every gate.</p>
      <div id="menuStats" class="stats"></div>
     <div class="row">
    <button class="primary" id="primaryBtn">PLAY</button>
    <button class="ghost" id="retryBtn" style="display:none;">RETRY</button>
    <button class="ghost" id="exitBtn" style="display:none;">EXIT</button>
    <button class="ghost" id="optionsBtn">OPTIONS</button>
</div>
      <p class="tiny" id="menuTiny">Press Space / ↑ / click to flap.</p>
    </div>
  </div>

  <div id="options">
    <div class="panel">
      <div class="tag">OPTIONS</div>
      <h1>Controls & Physics</h1>
      <p>Change difficulty, visual theme, particle density, and screen shake.</p>

      <div class="field">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="chill">Chill</option>
          <option value="arcade" selected>Arcade</option>
          <option value="chaos">Chaos</option>
        </select>
      </div>

      <div class="field">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="neon" selected>Neon</option>
          <option value="sunset">Sunset</option>
          <option value="aurora">Aurora</option>
        </select>
      </div>

      <div class="checkRow">
        <span>Particles</span>
        <input type="checkbox" id="particles" checked />
      </div>

      <div class="checkRow" style="margin-top:10px;">
        <span>Screen shake</span>
        <input type="checkbox" id="shake" checked />
      </div>

      <div class="row">
        <button class="primary" id="applyOptions">APPLY</button>
        <button class="ghost" id="closeOptions">CLOSE</button>
      </div>
    </div>
  </div>
<script> src="neon_flap.js" </script> 

<script type="module" src="protect.js"></script>
</body>
</html>
