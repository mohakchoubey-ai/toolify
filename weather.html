<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pro | Toolbox Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/weather.css">
</head>
<body data-theme="dark">

    <a href="index.html" class="hub-link">← HUB</a>

    <button class="theme-switch" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span> <span id="themeText">Light Mode</span>
    </button>

    <div class="container">
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="Search city (e.g. Indore)..." autocomplete="off">
            <div id="autocompleteList" class="autocomplete-list"></div>
        </div>

        <center>
            <button class="refresh-btn" onclick="detectLocation()">Use My Location</button>
            <p id="statusText" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; min-height: 1.2rem;"></p>
        </center>

        <div class="weather-card" id="mainWeather">
            <div class="main-info">
                <div>
                    <h2 id="cityName" style="font-size: 2rem;"></h2>
                    <p id="locationDetails"></p>
                    <p id="conditionText"></p>
                </div>
                <div style="text-align: right;">
                    <img id="weatherIcon" src="">
                    <div id="temperature" class="temp-display"></div>
                </div>
            </div>

            <div class="grid-stats">
                <div class="stat-box"><p>Feels Like</p><span id="feelsLike">--</span></div>
                <div class="stat-box"><p>Humidity</p><span id="humidity">--</span></div>
                <div class="stat-box"><p>Wind Speed</p><span id="wind">--</span></div>
                <div class="stat-box"><p>Rain</p><span id="precip">--</span></div>
            </div>
        </div>

        <div class="forecast-container" id="forecastSection">
            <h3 style="margin-bottom: 15px; font-size: 0.9rem; color: var(--text-muted);">7-DAY FORECAST</h3>
            <div class="forecast-row" id="forecastRow"></div>
        </div>
    </div>

    <footer>
        <hr>
        <div class="footer-links">
            <a href="terms.html">Terms & Conditions</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="aboutus.html">About Us</a>
            <a href="feedback.html">Feedback</a>
        </div>
        <p class="branding">Developed with ♥ by mohak 2026</p>
        <p class="other-sites">
            Our other sites: 
            <strong><a href="https://mohakdev1220.github.io/facts">facts</a></strong> & 
            <strong><a href="https://mohakdev1220.github.io/chromeportal">chromeportal</a></strong>
        </p>
    </footer>

    <script src="assets/js/weather.js"></script>
</body>
</html>
