<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivatation AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #17171c;
    --border: #2a2a32;
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.12);
    --amber-glow: rgba(245,166,35,0.25);
    --text: #f0ede8;
    --text-muted: #7a7a88;
    --user-bubble: #1f1f28;
    --ai-bubble: #13131a;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  /* ─── LAYOUT ─── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
  }

  /* ─── HEADER ─── */
  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 10px var(--amber), 0 0 24px var(--amber-glow);
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px var(--amber), 0 0 24px var(--amber-glow); }
    50% { opacity: 0.6; transform: scale(0.8); box-shadow: 0 0 6px var(--amber); }
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--text);
  }

  header h1 span {
    color: var(--amber);
    font-style: italic;
  }

  .header-tag {
    margin-left: auto;
    font-size: 0.68rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 300;
  }

  /* ─── MESSAGES ─── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: fadeUp 0.35s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-items: flex-end; }
  .msg.ai   { align-items: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 14px 18px;
    border-radius: 18px;
    line-height: 1.65;
    font-size: 0.925rem;
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }

  .msg.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid rgba(245,166,35,0.15);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg-role {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
    padding: 0 4px;
  }

  .msg.ai .msg-role { color: var(--amber); opacity: 0.7; }

  /* Typing indicator */
  .typing-dots {
    display: flex;
    gap: 5px;
    padding: 4px 0;
    align-items: center;
  }

  .typing-dots span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--amber);
    opacity: 0.4;
    animation: dot-bounce 1.4s ease infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40%           { transform: translateY(-6px); opacity: 1; }
  }

  /* Welcome state */
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    padding: 32px 24px;
    gap: 16px;
    pointer-events: none;
  }

  #welcome h2 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 400;
    line-height: 1.25;
  }

  #welcome h2 em {
    color: var(--amber);
    font-style: italic;
  }

  #welcome p {
    color: var(--text-muted);
    font-size: 0.9rem;
    max-width: 360px;
    line-height: 1.7;
    font-weight: 300;
  }

  .prompt-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
    pointer-events: all;
  }

  .chip {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .chip:hover {
    border-color: var(--amber);
    color: var(--amber);
    background: var(--amber-dim);
  }

  /* ─── INPUT AREA ─── */
  #input-area {
    padding: 16px 20px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within {
    border-color: rgba(245,166,35,0.4);
    box-shadow: 0 0 0 3px rgba(245,166,35,0.06);
  }

  #user-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.925rem;
    line-height: 1.5;
    resize: none;
    max-height: 140px;
    min-height: 24px;
    overflow-y: auto;
    padding: 2px 0;
  }

  #user-input::placeholder { color: var(--text-muted); }

  #user-input::-webkit-scrollbar { width: 3px; }
  #user-input::-webkit-scrollbar-thumb { background: var(--border); }

  #send-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: none;
    background: var(--amber);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    position: relative;
  }

  #send-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 0 18px var(--amber-glow);
  }

  #send-btn:active:not(:disabled) { transform: scale(0.95); }

  #send-btn:disabled {
    background: var(--border);
    cursor: not-allowed;
  }

  #send-btn svg { display: block; }

  /* pulse ring */
  #send-btn::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 13px;
    border: 1.5px solid var(--amber);
    opacity: 0;
    animation: pulse-ring 2.5s ease-out infinite;
  }

  #send-btn:disabled::after { display: none; }

  @keyframes pulse-ring {
    0%   { opacity: 0; transform: scale(1); }
    30%  { opacity: 0.5; }
    100% { opacity: 0; transform: scale(1.35); }
  }

  .hint {
    text-align: center;
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 10px;
    letter-spacing: 0.03em;
    opacity: 0.6;
  }

  /* ─── MOBILE ─── */
  @media (max-width: 480px) {
    header { padding: 14px 16px; }
    #messages { padding: 16px 14px; gap: 16px; }
    #input-area { padding: 12px 14px 16px; }
    .bubble { max-width: 92%; font-size: 0.9rem; }
    #welcome h2 { font-size: 1.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-dot, .typing-dots span, #send-btn::after { animation: none; }
    .msg { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo-dot"></div>
    <h1>Motivat<span>a</span>tion AI</h1>
    <span class="header-tag">No data saved · Free</span>
  </header>

  <div id="messages">
    <div id="welcome">
      <h2>Whatever you're going through,<br><em>let's face it together.</em></h2>
      <p>Tell me what's holding you back — a habit, a fear, burnout, self-doubt. I understand deeply and I'm here for you.</p>
      <div class="prompt-chips">
        <button class="chip" onclick="useChip(this)">I keep procrastinating</button>
        <button class="chip" onclick="useChip(this)">I feel like giving up</button>
        <button class="chip" onclick="useChip(this)">I'm stuck in a bad habit</button>
        <button class="chip" onclick="useChip(this)">I'm burned out</button>
        <button class="chip" onclick="useChip(this)">I feel like a failure</button>
        <button class="chip" onclick="useChip(this)">I have no motivation</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-row">
      <textarea
        id="user-input"
        placeholder="Tell me what's going on..."
        rows="1"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 8L14 2L8 14L7 9L2 8Z" fill="#0d0d0f" stroke="#0d0d0f" stroke-width="0.5" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <p class="hint">No account needed · Nothing is stored · Just for you</p>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────
// After deploying your Cloudflare Worker, paste its URL here.
// Example: 'https://motivatation-ai.YOUR-SUBDOMAIN.workers.dev/chat'
const WORKER_URL = 'https://motivatation-ai.mohakchoubey.workers.dev/chat';
// ──────────────────────────────────────────────────────

let history = [];
let isLoading = false;

const messagesEl = document.getElementById('messages');
const welcomeEl  = document.getElementById('welcome');
const inputEl    = document.getElementById('user-input');
const sendBtn    = document.getElementById('send-btn');

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function useChip(btn) {
  inputEl.value = btn.textContent;
  inputEl.dispatchEvent(new Event('input'));
  sendMessage();
}

function appendMessage(role, text) {
  if (welcomeEl && welcomeEl.parentNode) welcomeEl.remove();

  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const roleLabel = document.createElement('div');
  roleLabel.className = 'msg-role';
  roleLabel.textContent = role === 'user' ? 'You' : 'Motivatation AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  msg.appendChild(roleLabel);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  scrollToBottom();
  return bubble;
}

function showTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg ai';
  msg.id = 'typing-msg';

  const roleLabel = document.createElement('div');
  roleLabel.className = 'msg-role';
  roleLabel.textContent = 'Motivatation AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  msg.appendChild(roleLabel);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  scrollToBottom();
}

function removeTyping() {
  const t = document.getElementById('typing-msg');
  if (t) t.remove();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  appendMessage('user', text);
  history.push({ role: 'user', content: text });
  showTyping();

  try {
    // Calls YOUR Cloudflare Worker — Groq key is safe inside the Worker
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });

    const data = await response.json();
    removeTyping();

    if (!response.ok) {
      // Rate limit message comes with a nice user-facing string
      const msg = data.message || "Something went wrong. Please try again.";
      appendMessage('ai', msg);
      if (response.status !== 429) history.pop(); // remove failed user msg from history
      return;
    }

    const reply = data.reply || "I'm here for you. Can you tell me a little more?";
    appendMessage('ai', reply);
    history.push({ role: 'assistant', content: reply });

  } catch (err) {
    removeTyping();
    appendMessage('ai', "Couldn't reach the server. Check your connection and try again.");
    history.pop(); // remove the user message since it didn't go through
    console.error(err);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}
</script>
</body>
</html>
