<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Toolify | Sign in</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0f1115;
    --card:#171a21;
    --border:#2a2f3a;
    --text:#e8eaed;
    --muted:#9aa0a6;
    --blue:#1a73e8;
    --blue-hover:#1557b0;
    --red:#f28b82;
    --green:#81c995;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Roboto,Arial,sans-serif;
    background:radial-gradient(circle at top,#111827,#0b0d11);
    color:var(--text);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:30px;
}

.header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.header img{
    width:34px;
    height:34px;
}

.header h2{
    font-size:18px;
    font-weight:700;
}

.title{
    font-size:22px;
    margin-bottom:6px;
}

.sub{
    font-size:14px;
    color:var(--muted);
    margin-bottom:18px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0f1115;
    color:white;
    margin-bottom:10px;
}

input:focus{
    outline:none;
    border-color:var(--blue);
}

button{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

.primary{
    background:var(--blue);
    color:white;
}

.primary:hover{
    background:var(--blue-hover);
}

.google{
    background:white;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.google img{width:18px}

.link{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin-top:12px;
    cursor:pointer;
}

.link:hover{color:white}

.status{
    display:none;
    margin-top:10px;
    padding:10px;
    border-radius:8px;
    font-size:13px;
}

.show{display:block}
.error{background:rgba(242,139,130,.15);color:var(--red)}
.success{background:rgba(129,201,149,.15);color:var(--green)}

</style>
</head>

<body>

<div class="card">

    <div class="header">
        <img src="logo.png" />
        <h2>Toolify</h2>
    </div>

    <div class="title">Sign in</div>
    <div class="sub">Use your account to continue</div>

    <button class="google" id="googleBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
        Continue with Google
    </button>

    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">

    <button class="primary" id="signupBtn">Create account</button>
    <button class="primary" id="loginBtn">Sign in</button>

    <div class="link" id="forgot">Forgot password?</div>

    <div id="status" class="status"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendEmailVerification,
sendPasswordResetEmail,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const email = document.getElementById("email");
const password = document.getElementById("password");
const status = document.getElementById("status");

function show(msg,type){
status.className = `status show ${type}`;
status.textContent = msg;
}

function clear(){
status.className="status";
status.textContent="";
}

/* GOOGLE */
document.getElementById("googleBtn").onclick = async () => {
try{
clear();
const provider = new GoogleAuthProvider();
await signInWithPopup(auth,provider);
}catch(e){
show(e.message,"error");
}
};

/* SIGN UP */
document.getElementById("signupBtn").onclick = async () => {
try{
clear();

const user = await createUserWithEmailAndPassword(
auth,
email.value,
password.value
);

await sendEmailVerification(user.user);
await signOut(auth);

show("Verification email sent. Check inbox.","success");

}catch(e){
show(e.message,"error");
}
};

/* LOGIN */
document.getElementById("loginBtn").onclick = async () => {
try{
clear();

const user = await signInWithEmailAndPassword(
auth,
email.value,
password.value
);

await user.user.reload();

if(!user.user.emailVerified){
await signOut(auth);
show("Verify email first.","error");
return;
}

window.location.href="home.html";

}catch(e){
show(e.message,"error");
}
};

/* RESET */
document.getElementById("forgot").onclick = async () => {
try{
await sendPasswordResetEmail(auth,email.value);
show("Reset email sent.","success");
}catch(e){
show(e.message,"error");
}
};

/* AUTO LOGIN */
onAuthStateChanged(auth,(user)=>{
if(user && user.emailVerified){
window.location.href="home.html";
}
});

</script>

</body>
</html>
