<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toolify Login</title>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;display:grid;place-items:center;min-height:100vh}
.card{width:min(420px,92vw);background:#1e293bcc;padding:28px;border-radius:18px;backdrop-filter:blur(12px)}
.tabs{display:flex;margin:12px 0}
.tabs button{flex:1;padding:10px;border:0;background:#334155;color:#fff;cursor:pointer}
.tabs button.active{background:#2563eb}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff}
button.main{width:100%;padding:12px;border:0;border-radius:8px;background:#10b981;color:#fff;font-weight:700;cursor:pointer}
button.google{width:100%;padding:12px;border:0;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center}
a{color:#7dd3fc;text-decoration:none;font-size:.9rem}
#status{margin:10px 0;font-size:.9rem}
</style>
</head>
<body>
<div class="card">
<h2>🛠️ Toolify</h2>
<p>Sign in to continue</p>
<button class="google" id="google-login-btn">Continue with Google</button>
<div class="tabs">
<button id="signinTab" class="active">Sign In</button>
<button id="signupTab">Create Account</button>
</div>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<div class="row">
<label><input id="show" type="checkbox"> Show password</label>
<a href="#" id="forgot">Forgot Password?</a>
</div>
<div id="status"></div>
<button class="main" id="action">Sign In</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getAuth,GoogleAuthProvider,signInWithPopup,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendEmailVerification,
sendPasswordResetEmail,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyAeHDhdiTRwftUGYgrb1m19v7hm2R5rb-Y", authDomain: "toolbox-hub-98c03.firebaseapp.com", projectId: "toolbox-hub-98c03", storageBucket: "toolbox-hub-98c03.firebasestorage.app", messagingSenderId: "321020105472", appId: "1:321020105472:web:356e7c2903def7b9d859e5" };
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

let signup=false;
const $=id=>document.getElementById(id);
$("show").onchange=()=>{$("password").type=$("show").checked?"text":"password";};

function status(t,c="white"){$("status").textContent=t;$("status").style.color=c;}

$("signinTab").onclick=()=>{signup=false;$("action").textContent="Sign In";$("signinTab").classList.add("active");$("signupTab").classList.remove("active");}
$("signupTab").onclick=()=>{signup=true;$("action").textContent="Create Account";$("signupTab").classList.add("active");$("signinTab").classList.remove("active");}

$("google-login-btn").onclick=async()=>{
 try{await signInWithPopup(auth,new GoogleAuthProvider());location="index.html";}
 catch(e){status(e.message,"tomato")}
};

$("action").onclick=async()=>{
 const email=$("email").value.trim(),pass=$("password").value;
 if(!email||!pass)return status("Enter email & password","orange");
 try{
  if(signup){
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await sendEmailVerification(cred.user);
    await signOut(auth);
    status("Verification email sent. Verify your email before signing in.","lightgreen");
  }else{
    const cred=await signInWithEmailAndPassword(auth,email,pass);
    await cred.user.reload();
    if(!cred.user.emailVerified){
      await sendEmailVerification(cred.user);
      await signOut(auth);
      return status("Email not verified. A new verification email has been sent.","orange");
    }
    location="index.html";
  }
 }catch(e){status(e.message,"tomato")}
};

$("forgot").onclick=async(e)=>{
 e.preventDefault();
 const email=$("email").value.trim();
 if(!email)return status("Enter your email first.","orange");
 try{
   await sendPasswordResetEmail(auth,email);
   status("Password reset email sent.","lightgreen");
 }catch(err){status(err.message,"tomato")}
};
</script>
</body>
</html>
