<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Presentation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f172a;
    color:white;
    display:flex;
    flex-direction:column;
    height:100vh;
}

header{
    background:#111827;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #334155;
}

header h1{
    font-size:24px;
}

.btn{
    background:#2563eb;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    text-decoration:none;
    transition:.3s;
    font-weight:bold;
}

.btn:hover{
    background:#1d4ed8;
}

iframe{
    width:100%;
    height:calc(100vh - 72px);
    border:none;
}
</style>

</head>
<body>

<header>
    <h1>AI Presentation</h1>

    <a class="btn"
       href="https://docs.google.com/presentation/d/17PTWU3nwOx717AVjgTNRSW932-3Otfle4e51k2_qNTg/edit?usp=sharing"
       target="_blank">
       Open in Google Slides
    </a>
</header>

<iframe
src="https://docs.google.com/presentation/d/17PTWU3nwOx717AVjgTNRSW932-3Otfle4e51k2_qNTg/edit?usp=sharing">
</iframe>

</body>
</html>
