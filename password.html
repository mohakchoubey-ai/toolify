<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Password Gen | Toolbox Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/password.css">
</head>
<body data-theme="dark">

    <button class="theme-switch" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span> <span id="themeText">Light Mode</span>
    </button>

    <div class="card">
        <h1>Password Pro</h1>
        <div class="display-box"><div id="passwordResult">Click Generate</div></div>
        <div class="strength-container"><div id="strengthBar"></div></div>

        <div class="setting"><label>Length</label><span id="lenDisplay" style="color: var(--accent)">16</span></div>
        <input type="range" id="lengthSlider" min="8" max="50" value="16">

        <div class="setting"><label>Include Uppercase</label><input type="checkbox" id="upCase" checked></div>
        <div class="setting"><label>Include Numbers</label><input type="checkbox" id="nums" checked></div>
        <div class="setting"><label>Include Symbols</label><input type="checkbox" id="syms"></div>

        <div class="actions">
            <button class="main-btn btn-primary" onclick="generate()">Generate</button>
            <button class="main-btn btn-secondary" onclick="copy()">Copy</button>
        </div>
    </div>

    <footer>
        <hr>
        <div class="footer-links">
            <a href="terms.html">Terms & Conditions</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="aboutus.html">About Us</a>
            <a href="feedback.html">Feedback</a>
        </div>
        <p class="branding">Developed with ♥ by mohak 2026</p>
        <p class="other-sites">
            Our other sites: 
            <a href="https://mohakdev1220.github.io/facts">facts</a> & 
            <a href="https://mohakdev1220.github.io/chromeportal">chromeportal</a>
        </p>
    </footer>

    <div id="toast">Copied to Clipboard!</div>

    <script src="assets/js/password.js"></script>
</body>
</html>
