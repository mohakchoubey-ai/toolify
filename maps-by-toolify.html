
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> TOolify Maps </title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        /* ==========================================================================
           1. CORE STYLES & GLASSMORPHISM DESIGN SYSTEM
           ========================================================================== */
        :root {
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Segoe UI, Roboto, sans-serif;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --bg-card: #ffffff;
            --bg-subtle: #f5f5f7;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --border-color: rgba(0, 0, 0, 0.1);
            --accent: #0071e3;
            --accent-hover: #005bb5;
            --danger: #ff3b30;
            --success: #34c759;
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        body.dark-mode {
            --bg-glass: rgba(28, 28, 30, 0.88);
            --bg-card: #1c1c1e;
            --bg-subtle: #2c2c2e;
            --text-main: #f5f5f7;
            --text-sub: #a1a1a6;
            --border-color: rgba(255, 255, 255, 0.12);
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-card);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        /* Floating Search Panel */
        .search-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            width: 380px;
            max-width: calc(100vw - 32px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .glass-box {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .search-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-input {
            width: 100%;
            height: 40px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--bg-subtle);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, background 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            transform: scale(1.06);
            background: var(--border-color);
        }

        /* Category Chips */
        .category-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .category-chips::-webkit-scrollbar { display: none; }

        .chip {
            padding: 6px 14px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 100px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.2s;
        }

        .chip:hover {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* Sidebar Drawer */
        .sidebar-drawer {
            position: absolute;
            top: 130px;
            left: 16px;
            bottom: 24px;
            width: 380px;
            max-width: calc(100vw - 32px);
            z-index: 999;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-drawer.active {
            display: flex;
        }

        .tab-bar {
            display: flex;
            background: var(--bg-subtle);
            border-radius: 100px;
            padding: 3px;
            margin-bottom: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--text-sub);
            border-radius: 100px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--bg-card);
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .drawer-title { font-size: 1.1rem; font-weight: 700; }

        .drawer-content {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        .result-card {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .result-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .result-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
        .result-address { font-size: 0.8rem; color: var(--text-sub); }

        /* Directions Routing Form */
        .route-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-subtle);
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .route-input-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
        }

        .route-input-wrap input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            color: var(--text-main);
            font-size: 0.88rem;
        }

        .route-summary {
            background: linear-gradient(135deg, #0071e3, #1d4ed8);
            color: #ffffff;
            padding: 14px;
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 8px;
        }

        .route-stat-val { font-size: 1.4rem; font-weight: 700; }
        .route-stat-lbl { font-size: 0.75rem; opacity: 0.85; text-transform: uppercase; }

        /* Turn-by-Turn Step Card */
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px;
            background: var(--bg-subtle);
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            font-size: 0.85rem;
        }

        .step-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .step-text { flex: 1; font-weight: 500; }
        .step-dist { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }

        /* Floating Action Buttons */
        .fab-stack {
            position: absolute;
            bottom: 24px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fab {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s;
        }

        .fab:hover { transform: scale(1.08); background: var(--bg-card); }
        .fab.active { background: var(--accent); color: #ffffff; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Search Header -->
    <div class="search-panel">
        <div class="glass-box">
            <div class="search-input-group">
                <span style="font-size: 1.2rem;">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search places, cities, addresses..." />
                <button class="icon-btn" id="clearSearchBtn" title="Clear">✕</button>
            </div>
        </div>

        <!-- Category Chips -->
        <div class="category-chips">
            <button class="chip" onclick="searchCategory('Restaurants')">🍜 Food</button>
            <button class="chip" onclick="searchCategory('Cafes')">☕ Coffee</button>
            <button class="chip" onclick="searchCategory('Hotels')">🏨 Hotels</button>
            <button class="chip" onclick="searchCategory('Parks')">🌿 Parks</button>
            <button class="chip" onclick="searchCategory('Gas Stations')">⛽ Gas</button>
        </div>
    </div>

    <!-- Floating Action Buttons -->
    <div class="fab-stack">
        <button class="fab" id="routesFabBtn" title="Driving Directions" onclick="switchTab('directions'); openSidebar();">🚗</button>
        <button class="fab" id="locateBtn" title="My GPS Location">📍</button>
        <button class="fab" id="measureBtn" title="Distance Measure Mode">📏</button>
        <button class="fab" id="bookmarksBtn" title="Saved Bookmarks">⭐</button>
        <button class="fab" id="themeToggleBtn" title="Toggle Dark/Light Mode">🌙</button>
    </div>

    <!-- Sidebar Inspector Drawer -->
    <div class="sidebar-drawer glass-box" id="sidebarDrawer">
        <div class="tab-bar">
            <button class="tab-btn active" id="tabResultsBtn" onclick="switchTab('results')">Results</button>
            <button class="tab-btn" id="tabDirectionsBtn" onclick="switchTab('directions')">Routes</button>
            <button class="tab-btn" id="tabDetailsBtn" onclick="switchTab('details')">Info</button>
            <button class="tab-btn" id="tabSavedBtn" onclick="switchTab('saved')">Saved</button>
        </div>

        <div class="drawer-header">
            <h3 class="drawer-title" id="drawerTitle">Search Results</h3>
            <button class="icon-btn" onclick="closeSidebar()" style="width:28px; height:28px; font-size:0.8rem;">✕</button>
        </div>

        <div class="drawer-content" id="drawerContent">
            <!-- Dynamic Content Injected Here -->
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const state = {
            theme: localStorage.getItem('geopulse_theme') || 'light',
            map: null,
            tileLayer: null,
            markersGroup: null,
            routePolyline: null,
            routeMarkers: [],
            measurePolyline: null,
            measurePoints: [],
            activeTab: 'results',
            selectedPlace: null,
            searchResults: [],
            savedBookmarks: JSON.parse(localStorage.getItem('geopulse_saved') || '[]'),
            measureMode: false,
            routeStart: null, // { lat, lng, name }
            routeEnd: null    // { lat, lng, name }
        };

        const TILES = {
            light: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
            dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        };

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            applyTheme();
            setupEventListeners();
        });

        function initMap() {
            state.map = L.map('map', { zoomControl: false }).setView([51.505, -0.09], 13);
            L.control.zoom({ position: 'topright' }).addTo(state.map);

            state.tileLayer = L.tileLayer(TILES[state.theme], {
                maxZoom: 19,
                attribution: '© OpenStreetMap, © CartoDB, © OSRM'
            }).addTo(state.map);

            state.markersGroup = L.layerGroup().addTo(state.map);
            state.map.on('click', handleMapClick);
        }

        function applyTheme() {
            document.body.classList.toggle('dark-mode', state.theme === 'dark');
            document.getElementById('themeToggleBtn').textContent = state.theme === 'dark' ? '☀️' : '🌙';
            if (state.tileLayer) state.tileLayer.setUrl(TILES[state.theme]);
        }

        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            let debounceTimer;

            searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                const query = e.target.value.trim();
                if (query.length > 2) debounceTimer = setTimeout(() => executeSearch(query), 400);
            });

            document.getElementById('clearSearchBtn').addEventListener('click', () => {
                searchInput.value = '';
                state.markersGroup.clearLayers();
                closeSidebar();
            });

            document.getElementById('themeToggleBtn').addEventListener('click', () => {
                state.theme = state.theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('geopulse_theme', state.theme);
                applyTheme();
            });

            document.getElementById('locateBtn').addEventListener('click', locateUser);
            document.getElementById('measureBtn').addEventListener('click', toggleMeasureMode);
            document.getElementById('bookmarksBtn').addEventListener('click', () => { switchTab('saved'); openSidebar(); });
        }

        /* ==========================================================================
           SEARCH & NOMINATIM GEOCODING
           ========================================================================== */
        async function executeSearch(query) {
            if (!query) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8`);
                const data = await res.json();
                state.searchResults = data;
                renderSearchResults(data);
                switchTab('results');
                openSidebar();

                state.markersGroup.clearLayers();
                if (data.length > 0) {
                    const bounds = data.map(p => [parseFloat(p.lat), parseFloat(p.lon)]);
                    data.forEach((place) => {
                        const marker = L.marker([parseFloat(place.lat), parseFloat(place.lon)]).addTo(state.markersGroup);
                        marker.bindPopup(`<b>${escapeHTML(place.display_name.split(',')[0])}</b>`);
                        marker.on('click', () => selectPlace(place));
                    });
                    state.map.fitBounds(bounds, { padding: [50, 50] });
                }
            } catch (err) { console.error("Search error:", err); }
        }

        function searchCategory(cat) {
            const c = state.map.getCenter();
            document.getElementById('searchInput').value = cat;
            executeSearch(`${cat} near ${c.lat.toFixed(3)}, ${c.lng.toFixed(3)}`);
        }

        /* ==========================================================================
           OSRM REAL-TIME ROUTING & TURN-BY-TURN ENGINE
           ========================================================================== */
        async function calculateOSRMRoute() {
            if (!state.routeStart || !state.routeEnd) {
                alert("Please set both Start and Destination points!");
                return;
            }

            const container = document.getElementById('drawerContent');
            container.innerHTML = `<div style="text-align:center; padding:20px;">🚗 Calculating fastest route via OSRM...</div>`;

            const url = `https://router.project-osrm.org/route/v1/driving/${state.routeStart.lng},${state.routeStart.lat};${state.routeEnd.lng},${state.routeEnd.lat}?overview=full&geometries=geojson&steps=true`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.code !== 'Ok' || !data.routes.length) {
                    container.innerHTML = `<p style="color:var(--danger); padding:10px;">Unable to find driving route between selected locations.</p>`;
                    return;
                }

                const route = data.routes[0];
                renderRouteOnMap(route);
                renderTurnByTurnDirections(route);
            } catch (err) {
                console.error("OSRM Routing Error:", err);
                container.innerHTML = `<p style="color:var(--danger); padding:10px;">Failed to reach OSRM routing server. Check connection.</p>`;
            }
        }

        function renderRouteOnMap(route) {
            // Clear existing route overlays
            if (state.routePolyline) state.map.removeLayer(state.routePolyline);
            state.routeMarkers.forEach(m => state.map.removeLayer(m));
            state.routeMarkers = [];

            // GeoJSON coordinates are [lng, lat] -> convert to Leaflet [lat, lng]
            const latLngs = route.geometry.coordinates.map(c => [c[1], c[0]]);

            state.routePolyline = L.polyline(latLngs, {
                color: '#0071e3',
                weight: 6,
                opacity: 0.85,
                lineJoin: 'round'
            }).addTo(state.map);

            // Add Start and End Pins
            const startMarker = L.circleMarker([state.routeStart.lat, state.routeStart.lng], {
                radius: 8, fillColor: '#34c759', color: '#ffffff', weight: 3, fillOpacity: 1
            }).addTo(state.map).bindPopup("<b>Start:</b> " + state.routeStart.name);

            const endMarker = L.circleMarker([state.routeEnd.lat, state.routeEnd.lng], {
                radius: 8, fillColor: '#ff3b30', color: '#ffffff', weight: 3, fillOpacity: 1
            }).addTo(state.map).bindPopup("<b>Destination:</b> " + state.routeEnd.name);

            state.routeMarkers.push(startMarker, endMarker);
            state.map.fitBounds(state.routePolyline.getBounds(), { padding: [60, 60] });
        }

        function renderTurnByTurnDirections(route) {
            const distKm = (route.distance / 1000).toFixed(1);
            const durationMins = Math.round(route.duration / 60);

            let html = `
                <div class="route-summary">
                    <div>
                        <div class="route-stat-val">${distKm} km</div>
                        <div class="route-stat-lbl">Distance</div>
                    </div>
                    <div>
                        <div class="route-stat-val">${durationMins} min</div>
                        <div class="route-stat-lbl">Drive Time</div>
                    </div>
                </div>
                <h4 style="margin:8px 0 4px; font-size:0.9rem;">Turn-by-Turn Steps</h4>
            `;

            const steps = route.legs[0].steps;
            steps.forEach((step, idx) => {
                const icon = getManeuverIcon(step.maneuver);
                const instruction = formatStepInstruction(step);
                const stepDist = step.distance > 1000 ? `${(step.distance/1000).toFixed(1)} km` : `${Math.round(step.distance)} m`;

                html += `
                    <div class="step-item">
                        <div class="step-icon">${icon}</div>
                        <div>
                            <div class="step-text">${instruction}</div>
                            <div class="step-dist">${stepDist}</div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('drawerContent').innerHTML = html;
        }

        function getManeuverIcon(maneuver) {
            const type = maneuver.type;
            const modifier = maneuver.modifier || '';

            if (type === 'depart') return '🚗';
            if (type === 'arrive') return '🏁';
            if (modifier.includes('left')) return '↰';
            if (modifier.includes('right')) return '↱';
            if (modifier.includes('straight')) return '⬆️';
            if (type.includes('roundabout')) return '🔄';
            return '⬆️';
        }

        function formatStepInstruction(step) {
            const road = step.name || 'unnamed road';
            const modifier = step.maneuver.modifier ? step.maneuver.modifier.replace('slight', 'slight').replace('sharp', 'sharp') : '';
            
            switch (step.maneuver.type) {
                case 'depart': return `Head ${modifier || 'forward'} on <b>${escapeHTML(road)}</b>`;
                case 'arrive': return `Arrive at destination`;
                case 'turn': return `Turn <b>${modifier}</b> onto <b>${escapeHTML(road)}</b>`;
                case 'new name': return `Continue onto <b>${escapeHTML(road)}</b>`;
                case 'roundabout': return `Take exit in roundabout onto <b>${escapeHTML(road)}</b>`;
                default: return `Continue onto <b>${escapeHTML(road)}</b>`;
            }
        }

        /* ==========================================================================
           TAB NAVIGATION & SIDEBAR PANELS
           ========================================================================== */
        function switchTab(tab) {
            state.activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            if (tab === 'results') {
                document.getElementById('tabResultsBtn').classList.add('active');
                renderSearchResults(state.searchResults);
            } else if (tab === 'directions') {
                document.getElementById('tabDirectionsBtn').classList.add('active');
                renderDirectionsForm();
            } else if (tab === 'saved') {
                document.getElementById('tabSavedBtn').classList.add('active');
                renderSavedBookmarks();
            } else if (tab === 'details') {
                document.getElementById('tabDetailsBtn').classList.add('active');
            }
        }

        function renderDirectionsForm() {
            document.getElementById('drawerTitle').textContent = 'Driving Directions';
            const container = document.getElementById('drawerContent');

            const startVal = state.routeStart ? state.routeStart.name : '';
            const endVal = state.routeEnd ? state.routeEnd.name : '';

            container.innerHTML = `
                <div class="route-form">
                    <div class="route-input-wrap">
                        <span>🟢</span>
                        <input type="text" id="startInput" placeholder="Choose starting point or click map..." value="${escapeHTML(startVal)}" />
                        <button onclick="setStartFromGPS()" style="border:none; background:none; cursor:pointer;" title="Use My Location">📍</button>
                    </div>
                    <div class="route-input-wrap">
                        <span>🔴</span>
                        <input type="text" id="endInput" placeholder="Choose destination..." value="${escapeHTML(endVal)}" />
                    </div>
                    <button class="chip" style="background:var(--accent); color:#fff; padding:10px; font-size:0.9rem; text-align:center;" onclick="triggerRouteCalculation()">Get Directions</button>
                </div>
            `;
        }

        async function triggerRouteCalculation() {
            const startStr = document.getElementById('startInput').value.trim();
            const endStr = document.getElementById('endInput').value.trim();

            if (startStr && (!state.routeStart || state.routeStart.name !== startStr)) {
                const geo = await geocodeFirst(startStr);
                if (geo) state.routeStart = { lat: parseFloat(geo.lat), lng: parseFloat(geo.lon), name: geo.display_name.split(',')[0] };
            }

            if (endStr && (!state.routeEnd || state.routeEnd.name !== endStr)) {
                const geo = await geocodeFirst(endStr);
                if (geo) state.routeEnd = { lat: parseFloat(geo.lat), lng: parseFloat(geo.lon), name: geo.display_name.split(',')[0] };
            }

            calculateOSRMRoute();
        }

        async function geocodeFirst(query) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
            const data = await res.json();
            return data[0] || null;
        }

        function setStartFromGPS() {
            if (!navigator.geolocation) return alert("Geolocation not supported.");
            navigator.geolocation.getCurrentPosition(pos => {
                state.routeStart = { lat: pos.coords.latitude, lng: pos.coords.longitude, name: "My Current Location" };
                renderDirectionsForm();
            });
        }

        function setDestinationDirectly(place) {
            state.routeEnd = { lat: parseFloat(place.lat), lng: parseFloat(place.lon), name: place.display_name.split(',')[0] };
            if (!state.routeStart) setStartFromGPS();
            switchTab('directions');
            openSidebar();
            if (state.routeStart) calculateOSRMRoute();
        }

        /* ==========================================================================
           HELPERS & MAP CLICK HANDLER
           ========================================================================== */
        function selectPlace(place) {
            state.selectedPlace = place;
            const lat = parseFloat(place.lat);
            const lon = parseFloat(place.lon);

            state.map.flyTo([lat, lon], 15);
            switchTab('details');
            openSidebar();

            document.getElementById('drawerTitle').textContent = place.display_name.split(',')[0];
            document.getElementById('drawerContent').innerHTML = `
                <div style="font-size:0.85rem; color:var(--text-sub); margin-bottom:12px;">${escapeHTML(place.display_name)}</div>
                
                <button class="chip" style="width:100%; text-align:center; background:var(--accent); color:#fff; padding:10px; margin-bottom:10px;" onclick="setDestinationDirectly(state.selectedPlace)">🚗 Directions to Here</button>

                <div style="display:flex; gap:8px;">
                    <button class="chip" style="flex:1; text-align:center;" onclick="saveBookmarkCurrent()">⭐ Save</button>
                    <button class="chip" style="flex:1; text-align:center;" onclick="copyCoordinates(${lat}, ${lon})">📋 Copy Coords</button>
                </div>
            `;
        }

        function renderSearchResults(results) {
            document.getElementById('drawerTitle').textContent = `Results (${results.length})`;
            const container = document.getElementById('drawerContent');
            if (!results.length) { container.innerHTML = `<p style="color:var(--text-sub); font-size:0.88rem;">No results found.</p>`; return; }

            container.innerHTML = results.map((place, idx) => `
                <div class="result-card" onclick="selectPlace(state.searchResults[${idx}])">
                    <div class="result-name">📍 ${escapeHTML(place.display_name.split(',')[0])}</div>
                    <div class="result-address">${escapeHTML(place.display_name)}</div>
                </div>
            `).join('');
        }

        function renderSavedBookmarks() {
            document.getElementById('drawerTitle').textContent = `Bookmarks (${state.savedBookmarks.length})`;
            const container = document.getElementById('drawerContent');
            if (!state.savedBookmarks.length) { container.innerHTML = `<p style="color:var(--text-sub); font-size:0.88rem;">No saved bookmarks yet.</p>`; return; }

            container.innerHTML = state.savedBookmarks.map((place, idx) => `
                <div class="result-card" onclick="selectPlace(state.savedBookmarks[${idx}])">
                    <div class="result-name">⭐ ${escapeHTML(place.display_name.split(',')[0])}</div>
                    <div class="result-address">${escapeHTML(place.display_name)}</div>
                </div>
            `).join('');
        }

        function saveBookmarkCurrent() {
            if (!state.selectedPlace) return;
            if (!state.savedBookmarks.some(b => b.osm_id === state.selectedPlace.osm_id)) {
                state.savedBookmarks.unshift(state.selectedPlace);
                localStorage.setItem('geopulse_saved', JSON.stringify(state.savedBookmarks));
                alert("Saved to Bookmarks!");
            }
        }

        function handleMapClick(e) {
            if (state.measureMode) {
                const { lat, lng } = e.latlng;
                state.measurePoints.push([lat, lng]);
                if (state.measurePoints.length === 2) {
                    const p1 = L.latLng(state.measurePoints[0]);
                    const p2 = L.latLng(state.measurePoints[1]);
                    const distKm = (p1.distanceTo(p2) / 1000).toFixed(2);
                    state.measurePolyline = L.polyline(state.measurePoints, { color: '#0071e3', weight: 4, dashArray: '6,8' }).addTo(state.map);
                    L.popup().setLatLng(p2).setContent(`<b>Distance:</b> ${distKm} km`).openOn(state.map);
                    toggleMeasureMode();
                }
            }
        }

        function locateUser() {
            navigator.geolocation?.getCurrentPosition(pos => {
                const { latitude, longitude } = pos.coords;
                state.map.flyTo([latitude, longitude], 15);
                L.circleMarker([latitude, longitude], { radius: 8, fillColor: '#0071e3', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(state.map).bindPopup("You are here").openPopup();
            });
        }

        function toggleMeasureMode() {
            state.measureMode = !state.measureMode;
            document.getElementById('measureBtn').classList.toggle('active', state.measureMode);
            if (state.measureMode) state.measurePoints = [];
        }

        function openSidebar() { document.getElementById('sidebarDrawer').classList.add('active'); }
        function closeSidebar() { document.getElementById('sidebarDrawer').classList.remove('active'); }
        function copyCoordinates(lat, lon) { navigator.clipboard.writeText(`${lat}, ${lon}`); alert("Coordinates copied!"); }
        function escapeHTML(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    </script>
</body>
</html>
