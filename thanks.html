<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Toolify</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 90%;
        }
        .header-brand {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }
        .logo {
            width: 80px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            color: #2d3436;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #636e72;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-home:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-brand">toolify</div>

    <img src="logo.png" alt="Toolify Logo" class="logo">

    <h1>Message Received!</h1>
    <p>Thank you for reaching out. Your feedback helps make our tools better for everyone.</p>

    <a href="index.html" class="btn-home">Back to Homepage</a>
</div>

</body>
</html>
