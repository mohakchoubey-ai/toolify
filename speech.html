<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolify | TTS Ultra Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: radial-gradient(circle at top right, #001a1d, #000000); color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--border); border-radius: 30px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); text-align: center; margin-top: 40px; }
        textarea { width: 100%; height: 150px; padding: 15px; border-radius: 18px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: white; outline: none; margin-bottom: 20px; font-size: 16px; resize: none; }
        .dropdown-box { position: relative; margin-bottom: 20px; }
        select { width: 100%; padding: 15px; border-radius: 15px; background: #111; color: white; border: 1px solid var(--border); cursor: pointer; font-weight: 600; appearance: none; outline: none; }
        .btn-play { width: 100%; background: var(--primary); color: #000; border: none; padding: 18px; border-radius: 50px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .btn-play:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--primary); }
        .loader { display: none; margin-top: 10px; font-size: 12px; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-bottom: 20px;">🎙️ TTS Ultra Suite</h2>
    <textarea id="tts-text" placeholder="Yahan apna message likhein..."></textarea>
    
    <div class="dropdown-box">
        <select id="tts-model">
            <option value="hi-IN-Wavenet-B">🇮🇳 Hindi - Real Male (Bhari)</option>
            <option value="hi-IN-Wavenet-A">🇮🇳 Hindi - Real Female (Saaf)</option>
            <option value="en-US-Wavenet-D">🇺🇸 English - Real Male</option>
            <option value="en-US-Wavenet-F">🇺🇸 English - Real Female</option>
        </select>
    </div>

    <button class="btn-play" onclick="processSpeech()">▶️ Play Audio</button>
    <div id="loader" class="loader">Generating AI Voice...</div>
</div>

<script>
    function processSpeech() {
        const text = document.getElementById('tts-text').value.trim();
        const model = document.getElementById('tts-model').value;
        const loader = document.getElementById('loader');

        if (!text) return alert("Pehle text toh likho!");

        loader.style.display = "block";

        // Hum "VoiceRSS" API ka use kar rahe hain jo ki free hai aur asli male/female voices deti hai
        // Key: 38874636906248669926880227189906 (Yeh ek public testing key hai)
        
        const lang = model.startsWith('hi') ? 'hi-in' : 'en-us';
        const isMale = model.includes('Male') || model.endsWith('B') || model.endsWith('D');
        
        // VoiceRSS URL construction
        const apiKey = "38874636906248669926880227189906"; 
        const voice = model.startsWith('hi') ? (isMale ? 'Ajit' : 'Deepa') : (isMale ? 'John' : 'Alice');
        
        const url = `https://api.voicerss.org/?key=${apiKey}&hl=${lang}&v=${voice}&src=${encodeURIComponent(text)}&f=48khz_16bit_stereo`;

        const audio = new Audio(url);
        audio.play().then(() => {
            loader.style.display = "none";
        }).catch(err => {
            loader.style.display = "none";
            alert("API Error! Please try again later.");
        });
    }
</script>

</body>
</html>
