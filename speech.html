<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolify | TTS Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #080808; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .nav-header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { text-decoration: none; color: var(--primary); font-weight: 600; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 12px; border: 1px solid var(--border); transition: 0.3s; }
        .container { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--border); border-radius: 30px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); text-align: center; }
        textarea { width: 100%; height: 160px; padding: 15px; border-radius: 18px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: white; outline: none; margin-bottom: 20px; font-size: 16px; resize: none; }
        select { width: 100%; padding: 15px; border-radius: 15px; background: #111; color: white; border: 1px solid var(--border); margin-bottom: 20px; cursor: pointer; font-weight: 600; outline: none; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { border: none; padding: 18px; border-radius: 50px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-play { background: var(--primary); color: #000; }
        .btn-dl { background: #fff; color: #000; }
        .status-dot { width: 8px; height: 8px; background: #ff4444; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .ready { background: #00ff00; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="#" class="back-btn">← HOME</a>
    <div style="font-weight: 800; color: var(--primary);">TOOLIFY</div>
</div>

<div class="container">
    <h2 style="margin-bottom: 10px;">🎙️ TTS Master</h2>
    <p style="font-size: 11px; margin-bottom: 20px; opacity: 0.6;">
        <span id="dot" class="status-dot"></span> Engine: <span id="engine-status">Searching for Voices...</span>
    </p>
    
    <textarea id="tts-input" placeholder="Yahan likhein (Hindi ya English)..."></textarea>
    
    <select id="voice-choice">
        <option value="hi-IN">🇮🇳 Hindi - Native</option>
        <option value="en-US">🇺🇸 English - US</option>
        <option value="en-GB">🇬🇧 English - UK</option>
    </select>

    <div class="btn-group">
        <button class="btn btn-play" onclick="speak()">▶️ Play</button>
        <button class="btn btn-dl" onclick="downloadAudio()">📥 Download</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('engine-status');
    let voices = [];

    function loadVoices() {
        // Filter for unique languages to keep the UI clean
        voices = synth.getVoices();
        if (voices.length > 0) {
            dot.classList.add('ready');
            statusText.innerText = "System Ready (" + voices.length + " voices)";
        }
    }

    // Initialize voices (needed for different browser behaviors)
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speak() {
        if (synth.speaking) synth.cancel();
        
        const text = document.getElementById('tts-input').value;
        const selectedLang = document.getElementById('voice-choice').value;
        
        if (!text.trim()) {
            alert("Pehle kuch likho!");
            return;
        }

        const utter = new SpeechSynthesisUtterance(text);
        
        // Find the best matching voice for the selected language
        const voice = voices.find(v => v.lang.startsWith(selectedLang));
        
        if (voice) {
            utter.voice = voice;
            utter.lang = voice.lang;
        } else {
            // Fallback to basic lang setting if specific voice isn't found
            utter.lang = selectedLang;
        }

        // Adjust speed for a more natural feel
        utter.rate = 1.0;
        utter.pitch = 1.0;

        synth.speak(utter);
    }

    function downloadAudio() {
        const text = document.getElementById('tts-input').value;
        const lang = document.getElementById('voice-choice').value.split('-')[0]; // gets 'hi' or 'en'
        
        if (!text.trim()) return alert("Pehle kuch likho!, Write something first! ");

        // Using a public TTS API for the download functionality
        const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${lang}&client=tw-ob`;
        
        // To force download instead of just opening a tab:
        const link = document.createElement('a');
        link.href = audioUrl;
        link.target = '_blank';
        link.download = 'toolify-speech.mp3';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
