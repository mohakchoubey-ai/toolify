<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolify | TTS Ultra</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: radial-gradient(circle at top right, #001a1d, #000000); color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .nav-header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { text-decoration: none; color: var(--primary); font-weight: 600; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 12px; border: 1px solid var(--border); transition: 0.3s; }
        .back-btn:hover { background: var(--primary); color: #000; }

        .container { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--border); border-radius: 30px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); text-align: center; }
        
        textarea { width: 100%; height: 160px; padding: 15px; border-radius: 18px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: white; outline: none; margin-bottom: 20px; font-size: 16px; resize: none; }
        
        select { width: 100%; padding: 15px; border-radius: 15px; background: #111; color: white; border: 1px solid var(--border); margin-bottom: 20px; cursor: pointer; font-weight: 600; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { border: none; padding: 18px; border-radius: 50px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-play { background: var(--primary); color: #000; }
        .btn-dl { background: #fff; color: #000; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="index.html" class="back-btn">← HOME</a>
    <div style="font-weight: 800; color: var(--primary);">TOOLIFY</div>
</div>

<div class="container">
    <h2 style="margin-bottom: 20px;">🎙️ TTS Ultra Engine</h2>
    <textarea id="tts-input" placeholder="Hindi ya English mein likhein..."></textarea>
    
    <select id="voice-type">
        <option value="hi-male">🇮🇳 Hindi - Male</option>
        <option value="hi-female">🇮🇳 Hindi - Female</option>
        <option value="en-male">🇺🇸 English - Male</option>
        <option value="en-female">🇺🇸 English - Female</option>
    </select>

    <div class="btn-group">
        <button class="btn btn-play" onclick="speakNow()">▶️ Play</button>
        <button class="btn btn-dl" onclick="downloadNow()">📥 Download</button>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    let voices = [];

    function getVoices() {
        voices = synth.getVoices();
    }
    getVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = getVoices;
    }

    function speakNow() {
        if (synth.speaking) synth.cancel();
        
        const text = document.getElementById('tts-input').value;
        const type = document.getElementById('voice-type').value;
        if (!text) return alert("Pehle kuch likho!");

        const utter = new SpeechSynthesisUtterance(text);
        
        // --- Smart Voice Selection ---
        let selectedVoice = null;
        if (type.startsWith('hi')) {
            // Try to find natural Microsoft Hindi voices first
            selectedVoice = voices.find(v => v.lang.includes('hi-IN') && v.name.includes(type.includes('male') ? 'Madhur' : 'Swara')) || 
                            voices.find(v => v.lang.includes('hi-IN'));
            
            // Extreme Pitch Adjust if native male isn't found
            if (type === 'hi-male') {
                utter.pitch = 0.55; 
                utter.rate = 0.88;
            } else {
                utter.pitch = 1.15;
            }
        } else {
            selectedVoice = voices.find(v => v.lang.includes('en') && v.name.includes(type.includes('male') ? 'David' : 'Zira'));
            utter.pitch = type.includes('male') ? 0.75 : 1.1;
        }

        if (selectedVoice) utter.voice = selectedVoice;
        synth.speak(utter);
    }

    function downloadNow() {
        const text = document.getElementById('tts-input').value;
        const lang = document.getElementById('voice-type').value.split('-')[0];
        if (!text) return alert("Kuch likho toh!");

        // Google TTS is reliable for one-click download/open
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${lang}&client=tw-ob`;
        window.open(url, '_blank');
    }
</script>
</body>
</html>
